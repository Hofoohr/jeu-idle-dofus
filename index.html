<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dofus Idle</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17110d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚔️%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">⚔️ Dofus Idle<small>Projet de fan non commercial</small></div>
    <nav id="nav" style="display:contents"></nav>
    <div class="side-foot">Sauvegarde auto toutes les 30 s.</div>
  </aside>
  <div id="main">
    <header id="topbar"></header>
    <section id="view"></section>
    <footer id="dock">
      <div class="dock-row">
        <div class="dock-info"><b id="dk-title">Aucune action</b><small id="dk-sub">Choisis un combat ou un métier.</small></div>
        <div class="bar turn"><div class="fill" id="dk-bar"></div><span class="bar-t" id="dk-bar-t"></span></div>
        <button class="btn sm danger" id="dk-stop" data-act="stop">⏹ Arrêter</button>
      </div>
      <div class="log-opts"><label><input type="checkbox" id="log-spells" data-act="togglespells" checked> Afficher les sorts lancés</label></div>
      <div id="journal"></div>
    </footer>
    <div id="legal">Projet de fan non officiel et non commercial. DOFUS est une marque d'Ankama, tous droits réservés.</div>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast"></div>
<script src="js/core/namespace.js"></script>
<script src="js/data/config.js"></script>
<script src="js/data/dofusdb-data.js"></script>
<script src="js/data/spells.js"></script>

<script src="js/data/runes.js"></script>
<script src="js/core/formulas.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/save.js"></script>
<script src="js/core/engine.js"></script>
<script src="js/systems/team.js"></script>
<script src="js/systems/inventory.js"></script>
<script src="js/systems/rewards.js"></script>
<script src="js/systems/combat.js"></script>
<script src="js/systems/gathering.js"></script>
<script src="js/systems/crafting.js"></script>
<script src="js/systems/offline.js"></script>

<script src="js/ui/modals.js"></script>
<script src="js/main.js"></script>
</body>
</html>
